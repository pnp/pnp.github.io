<section class="section-base samples" id="{{ .File.BaseFileName }}" aria-labelledby="{{ .File.BaseFileName }}-title">
    <div class="section-inner">
        <header class="section-header">
            <h2 id="{{ .File.BaseFileName }}-title">{{ .Title | safeHTML }}</h2>
            <p>{{ .Description | safeHTML }}</p>
        </header>
        <ul class="section-grid">
            {{ range partial "resource-pages.html" (dict "site" .Site "section" .Params.sectionname) }}
            <li>{{ partial "pnpstyles/organisms-sample-card" .Params }}</li>
            {{ end }}
        </ul>
    </div>
</section>
